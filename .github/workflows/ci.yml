name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build and test
        run: ./gradlew build --no-daemon
